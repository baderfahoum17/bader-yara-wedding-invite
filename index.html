<!doctype html>
<!-- What the bare baderandyara.com shows. The wedding invitation itself lives at a private path
     (see README), and the party page at /party/ has its own gate. Plain HTML: nothing to load. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Yara & Bader" />
    <meta property="og:description" content="Invitations are personal." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Mulish:wght@500&display=swap" rel="stylesheet" />
    <title>Yara & Bader</title>
    <style>
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(4rem, env(safe-area-inset-top)) 1.5rem max(4rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #f3efe6;
        color: #3a4032;
        text-align: center;
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      main { max-width: 28rem; }
      .hosts {
        margin: 0;
        font-family: 'Mulish', system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #9e4f2c;
      }
      h1 {
        margin: 1rem 0 0;
        font-size: 2.25rem;
        font-weight: 500;
        line-height: 1.15;
        text-wrap: balance;
      }
      p.note {
        margin: 1rem 0 0;
        font-size: 1.25rem;
        line-height: 1.4;
        color: rgb(58 64 50 / 0.8);
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="hosts" translate="no">Yara &amp; Bader</p>
      <h1>This invitation is personal</h1>
      <p class="note">Open the link Yara or Bader sent you. If you can’t find it, ask them for it.</p>
    </main>
  </body>
</html>
